<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Board</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      background-color: #f5f0e8;
      background-image:
        radial-gradient(circle, #c9bfad 1px, transparent 1px);
      background-size: 28px 28px;
      font-family: 'Georgia', serif;
      overflow: hidden;
      user-select: none;
    }

    .board-label {
      position: absolute;
      top: 28px;
      left: 32px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #8c7b6a;
      text-transform: uppercase;
    }

    .hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: #a0927f;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── CARD BASE ── */
    .card {
      position: absolute;
      cursor: grab;
      transition: box-shadow 0.2s ease, transform 0.15s ease;
      will-change: transform;
    }

    .card:hover {
      box-shadow: 0 18px 48px rgba(0,0,0,0.18);
      z-index: 100 !important;
    }

    .card:active {
      cursor: grabbing;
    }

    /* ── TAPE STRIP ── */
    .tape {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 54px;
      height: 26px;
      background: rgba(200, 190, 160, 0.55);
      border-radius: 3px;
      z-index: 2;
      backdrop-filter: blur(1px);
    }

    /* ── PAPER CARD (document style) ── */
    .paper {
      width: 170px;
      background: #fff;
      border-radius: 4px;
      padding: 0;
      box-shadow: 0 6px 24px rgba(0,0,0,0.13), 0 1px 4px rgba(0,0,0,0.08);
      overflow: visible;
      text-decoration: none;
      display: block;
    }

    .paper-inner {
      padding: 18px 16px 16px;
      pointer-events: none;
    }

    /* Lines mimicking a document */
    .doc-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .doc-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .doc-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #3a3028;
      text-transform: uppercase;
    }

    .doc-subtitle {
      font-size: 8.5px;
      color: #9e8e7e;
      margin-top: 2px;
      letter-spacing: 0.04em;
    }

    .doc-lines {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .line {
      height: 5px;
      border-radius: 3px;
      background: #e8e0d4;
    }

    .line.short { width: 60%; }
    .line.medium { width: 80%; }
    .line.full { width: 100%; }
    .line.accent { background: #d4c5b0; }

    .doc-divider {
      height: 1px;
      background: #ede5d8;
      margin: 10px 0;
    }

    .click-hint {
      text-align: center;
      font-size: 7.5px;
      letter-spacing: 0.12em;
      color: #b8a898;
      text-transform: uppercase;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #e0d6c8;
    }

    /* Behance card color accent */
    .card-behance .paper {
      border-bottom: 3px solid #1769ff;
    }

    .card-behance .doc-icon svg path,
    .card-behance .doc-icon svg rect {
      fill: #1769ff;
    }

    /* Resume card color accent */
    .card-resume .paper {
      border-bottom: 3px solid #c0a882;
    }

    /* ── INITIAL POSITIONS ── */
    #card-resume {
      left: 120px;
      top: 110px;
      transform: rotate(-4deg);
      z-index: 2;
    }

    #card-behance {
      left: 360px;
      top: 80px;
      transform: rotate(3.5deg);
      z-index: 3;
    }
  </style>
</head>
<body>

  <span class="board-label">My Links</span>
  <span class="hint">Try moving things around :)</span>

  <!-- ── RESUME CARD ── -->
  <div class="card card-resume" id="card-resume">
    <div class="tape"></div>
    <a class="paper" href="https://drive.google.com/drive/folders/14qrrc5bgkOEQmInGEp_mHTFLhEXX_IRE?usp=drive_link" target="_blank" rel="noopener noreferrer">
      <div class="paper-inner">
        <div class="doc-header">
          <div class="doc-icon">
            <!-- Document icon -->
            <svg width="22" height="28" viewBox="0 0 22 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="22" height="28" rx="3" fill="#f0e8dc"/>
              <path d="M6 2h9l5 5v19a2 2 0 01-2 2H4a2 2 0 01-2-2V4a2 2 0 012-2z" fill="#e0d0bc"/>
              <path d="M15 2l5 5h-4a1 1 0 01-1-1V2z" fill="#c8b89a"/>
              <rect x="4" y="10" width="14" height="1.5" rx="0.75" fill="#c0a882"/>
              <rect x="4" y="13" width="14" height="1.5" rx="0.75" fill="#d4c5b0"/>
              <rect x="4" y="16" width="10" height="1.5" rx="0.75" fill="#d4c5b0"/>
              <rect x="4" y="19" width="12" height="1.5" rx="0.75" fill="#d4c5b0"/>
              <rect x="4" y="22" width="8" height="1.5" rx="0.75" fill="#d4c5b0"/>
            </svg>
          </div>
          <div>
            <div class="doc-title">Resume</div>
            <div class="doc-subtitle">Phuong Anh · BA &amp; Designer</div>
          </div>
        </div>

        <div class="doc-lines">
          <div class="line full accent"></div>
          <div class="line medium"></div>
          <div class="line full"></div>
          <div class="line short"></div>
        </div>

        <div class="doc-divider"></div>

        <div class="doc-lines">
          <div class="line full"></div>
          <div class="line medium accent"></div>
          <div class="line full"></div>
          <div class="line short"></div>
          <div class="line medium"></div>
        </div>

        <div class="click-hint">Click to open ↗</div>
      </div>
    </a>
  </div>

  <!-- ── BEHANCE CARD ── -->
  <div class="card card-behance" id="card-behance">
    <div class="tape" style="left:40%; background: rgba(180,195,230,0.55);"></div>
    <a class="paper" href="https://www.behance.net/phphanh" target="_blank" rel="noopener noreferrer">
      <div class="paper-inner">
        <div class="doc-header">
          <div class="doc-icon">
            <!-- Behance "Bē" icon -->
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="28" height="28" rx="4" fill="#edf0ff"/>
              <path d="M7 8h6.2c2.4 0 4 1.2 4 3.2 0 1.2-.6 2.1-1.6 2.6 1.5.5 2.4 1.6 2.4 3.1 0 2.3-1.8 3.6-4.5 3.6H7V8zm5.8 4.8c.9 0 1.5-.5 1.5-1.3s-.5-1.2-1.5-1.2H9.4v2.5h3.4zm.4 5c1 0 1.7-.5 1.7-1.4s-.6-1.5-1.7-1.5H9.4v2.9h3.8z" fill="#1769ff"/>
              <path d="M19.5 11h5v1.1h-5V11z" fill="#1769ff"/>
              <path d="M22 13.5c-2 0-3.5 1.4-3.5 3.3s1.4 3.2 3.5 3.2c1.5 0 2.6-.7 3.1-1.9h-1.6c-.3.5-.8.7-1.5.7-1 0-1.7-.6-1.8-1.6H25.5c0-.1.01-.3.01-.4 0-1.9-1.4-3.3-3.51-3.3zm-1.8 2.6c.2-.9.8-1.4 1.8-1.4.9 0 1.6.5 1.7 1.4h-3.5z" fill="#1769ff"/>
            </svg>
          </div>
          <div>
            <div class="doc-title">Behance</div>
            <div class="doc-subtitle">phphanh · Portfolio</div>
          </div>
        </div>

        <div class="doc-lines">
          <div class="line full" style="background:#dce5ff"></div>
          <div class="line medium" style="background:#e8edff"></div>
          <div class="line full" style="background:#e8edff"></div>
          <div class="line short" style="background:#dce5ff"></div>
        </div>

        <div class="doc-divider" style="background:#e4eaff"></div>

        <!-- Mini project thumbnails -->
        <div style="display:flex; gap:6px; margin-top:2px;">
          <div style="width:48px;height:36px;background:#dce5ff;border-radius:3px;"></div>
          <div style="width:48px;height:36px;background:#e8edff;border-radius:3px;"></div>
          <div style="width:48px;height:36px;background:#d0daff;border-radius:3px;"></div>
        </div>

        <div class="click-hint" style="border-top-color:#dce5ff; color:#8fa0cc;">Click to open ↗</div>
      </div>
    </a>
  </div>

  <script>
    // ── Drag logic ──
    // We drag the .card wrapper; clicks on the <a> still work if mouse didn't move.
    let dragging = null;
    let offsetX = 0, offsetY = 0;
    let moved = false;

    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mousedown', e => {
        // Don't intercept right-click
        if (e.button !== 0) return;

        dragging = card;
        moved = false;

        const rect = card.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        card.style.zIndex = 999;
        card.style.transition = 'box-shadow 0.2s ease';
        card.style.boxShadow = '0 24px 56px rgba(0,0,0,0.22)';

        e.preventDefault(); // prevent text selection
      });
    });

    document.addEventListener('mousemove', e => {
      if (!dragging) return;

      const x = e.clientX - offsetX;
      const y = e.clientY - offsetY;

      // Keep current rotation from inline style or extract from transform
      const currentTransform = dragging.style.transform || '';
      const rotMatch = currentTransform.match(/rotate\(([^)]+)\)/);
      const rot = rotMatch ? rotMatch[1] : '0deg';

      dragging.style.left = x + 'px';
      dragging.style.top  = y + 'px';
      dragging.style.transform = `rotate(${rot})`;

      moved = true;
    });

    document.addEventListener('mouseup', e => {
      if (!dragging) return;

      dragging.style.boxShadow = '';
      dragging.style.zIndex = 10;

      // If card barely moved, let the click on <a> propagate naturally
      if (moved) {
        // Block the upcoming click event once to prevent accidental navigation
        const card = dragging;
        const blockClick = ev => {
          ev.preventDefault();
          ev.stopPropagation();
          card.removeEventListener('click', blockClick, true);
        };
        card.addEventListener('click', blockClick, true);
      }

      dragging = null;
    });

    // Touch support
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('touchstart', e => {
        const touch = e.touches[0];
        dragging = card;
        moved = false;
        const rect = card.getBoundingClientRect();
        offsetX = touch.clientX - rect.left;
        offsetY = touch.clientY - rect.top;
        card.style.zIndex = 999;
      }, { passive: true });
    });

    document.addEventListener('touchmove', e => {
      if (!dragging) return;
      e.preventDefault();
      const touch = e.touches[0];
      const x = touch.clientX - offsetX;
      const y = touch.clientY - offsetY;
      const currentTransform = dragging.style.transform || '';
      const rotMatch = currentTransform.match(/rotate\(([^)]+)\)/);
      const rot = rotMatch ? rotMatch[1] : '0deg';
      dragging.style.left = x + 'px';
      dragging.style.top  = y + 'px';
      dragging.style.transform = `rotate(${rot})`;
      moved = true;
    }, { passive: false });

    document.addEventListener('touchend', () => {
      if (dragging) {
        dragging.style.zIndex = 10;
        dragging = null;
      }
    });
  </script>
</body>
</html>
